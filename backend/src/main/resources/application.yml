spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:reconciliation_db}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  batch:
    jdbc:
      initialize-schema: always
  quartz:
    job-store-type: jdbc
    jdbc:
      initialize-schema: always
server:
  port: 8080
springdoc:
  swagger-ui:
    path: /swagger-ui.html
